[project]
name = "vich"
version = "0.1.0"
description = "VLM-based hierarchical chunking for structured documents: layout-aware PDF parsing and chunking for RAG pipelines."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "san9min", email = "sangmin09.lee@gmail.com" }]
requires-python = ">=3.11"
keywords = ["rag", "chunking", "pdf-parsing", "vlm", "document-ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Text Processing :: Indexing",
]

dependencies = [
    "pymupdf>=1.24",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Repository = "https://github.com/san9min/vich"

[project.scripts]
vich = "vich.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vich"]

[tool.uv]
dev-dependencies = ["pytest>=8.0", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"
